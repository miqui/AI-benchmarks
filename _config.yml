title: AI Benchmarks
description: A durable reference of the most popular AI leaderboards and benchmarks, updated per model release.
remote_theme: daattali/beautiful-jekyll@6.0.1
post_search: true
permalink: pretty
baseurl: "/AI-benchmarks"

plugins:
  - jekyll-remote-theme

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

navbar-links:
  Home: "/"
  Core Leaderboards: "/core-leaderboards"
  Coding Agents: "/coding-agents"
  Pitfalls: "/pitfalls"

aux_links:
  "GitHub repo":
    - "https://github.com/miqui/AI-benchmarks"
